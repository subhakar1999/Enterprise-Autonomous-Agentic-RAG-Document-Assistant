services:
  rag-assistant:
    build: .
    image: enterprise-agentic-rag:latest
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    depends_on:
      model-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # Downloads the selected open-source model once into the named volume.
  model-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      - ollama
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5:1.5b"]
    restart: "no"

volumes:
  ollama-models:
