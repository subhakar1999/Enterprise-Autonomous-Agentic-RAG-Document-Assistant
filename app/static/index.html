<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas RAG</title><style>
:root{color-scheme:dark;--bg:#09111f;--panel:#101d31;--line:#263752;--accent:#60a5fa;--text:#e7eefb;--muted:#9baac2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17335d,transparent 40%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:22px;margin:0}.tag{color:#8ab8ff;font-size:12px;border:1px solid #345687;padding:6px 9px;border-radius:99px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:#101d31cc;border:1px solid var(--line);border-radius:14px;padding:18px}h2{font-size:14px;margin:0 0 12px}p,label{color:var(--muted)}input,textarea,button{font:inherit}input,textarea{width:100%;background:#091526;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;margin:8px 0}textarea{height:96px;resize:vertical}button{background:var(--accent);border:0;padding:10px 13px;color:#061426;border-radius:8px;font-weight:700;cursor:pointer}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);margin-left:6px}.status{font-size:13px;margin-top:9px;min-height:20px}.trace{font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;color:#a9c5ef}.answer{white-space:pre-wrap;line-height:1.65;min-height:150px}.source{border-top:1px solid var(--line);padding:12px 0;font-size:13px}.source b{color:#9ac4ff}@media(max-width:760px){.grid{grid-template-columns:1fr}.shell{padding:16px}}
</style></head><body><main class="shell"><header><div><h1>Atlas · Enterprise Agentic RAG</h1><p>Hybrid retrieval, reranking, CRAG, and grounded citations.</p></div><span class="tag" id="health">Loading…</span></header><section class="grid"><aside class="card"><h2>1. Index a document</h2><input id="file" type="file" accept=".pdf,.txt,.md,.markdown"><button onclick="upload()">Upload & index</button><div class="status" id="uploadStatus"></div><hr style="border-color:#263752;margin:20px 0"><h2>2. Inspect retrieval</h2><input id="inspectQuery" placeholder="Try: What are the Q3 margins?"><button class="secondary" onclick="inspect()">Inspect rankings</button><div class="trace" id="inspection"></div></aside><section class="card"><h2>Ask your documents</h2><textarea id="query" placeholder="Ask a specific question grounded in your uploaded files…"></textarea><button onclick="ask()">Send</button><div class="trace" id="trace"></div><div class="answer" id="answer"></div><div id="sources"></div></section></section></main><script>
const $=id=>document.getElementById(id);
let portableDocuments=JSON.parse(sessionStorage.getItem('atlasDocuments')||'[]');
async function state(){try{let r=await fetch('/health');if(!r.ok)throw new Error(`HTTP ${r.status}`);let d=await r.json();$('health').textContent=d.mode==='vercel-demo'?`${portableDocuments.length} session docs · extractive demo`:`${d.documents} docs · ${d.child_chunks} chunks`}catch(error){$('health').textContent='API unavailable';$('health').title=error.message}}
state();
async function upload(){let f=$('file').files[0];if(!f)return $('uploadStatus').textContent='Choose a PDF, TXT, or Markdown file first.';let fd=new FormData;fd.append('file',f);$('uploadStatus').textContent='Indexing…';let r=await fetch('/api/v1/documents/upload',{method:'POST',body:fd}),d=await r.json();if(r.ok&&d.portable_document){portableDocuments.push(d.portable_document);sessionStorage.setItem('atlasDocuments',JSON.stringify(portableDocuments))}$('uploadStatus').textContent=r.ok?`Indexed ${d.chunks_indexed} retrieval chunks from ${d.filename}.`:d.detail;state()}
async function inspect(){let q=$('inspectQuery').value;if(!q)return;let r=await fetch('/api/v1/retrieval/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,documents:portableDocuments})}),d=await r.json();$('inspection').innerHTML=`CRAG: ${d.crag}<br>`+d.results.map((x,i)=>`${i+1}. ${x.filename} · score ${x.rerank_score}`).join('<br>')}
async function ask(){let q=$('query').value.trim();if(!q)return;$('answer').textContent='';$('trace').textContent='';$('sources').innerHTML='';let r=await fetch('/api/v1/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,documents:portableDocuments})});let reader=r.body.getReader(),buf='',decoder=new TextDecoder;while(true){let {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let blocks=buf.split('\n\n');buf=blocks.pop();for(let b of blocks){let event=(b.match(/event: (.+)/)||[])[1],raw=(b.match(/data: (.+)/)||[])[1];if(!raw)continue;let d=JSON.parse(raw);if(event==='trace')$('trace').textContent+=`› ${d.message}\n`;if(event==='token')$('answer').textContent+=d.text;if(event==='citations')$('sources').innerHTML='<h2>Verified sources</h2>'+d.map(s=>`<div class="source"><b>[^${s.number}] ${s.filename}, page ${s.page}</b><br>${s.excerpt}</div>`).join('')}}}}
</script></body></html>
